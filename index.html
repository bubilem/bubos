<!doctype html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>BubOS</title>
  <link rel="stylesheet" href="css/bubos.css">
</head>
<body>
  <header class="top">
    <h1>Bub<span>OS</span></h1>
    <nav>
      <button id="btn-export" data-i18n="ui.export" data-i18n-title="ui.export.title"></button>
      <button id="btn-import" data-i18n="ui.import" data-i18n-title="ui.import.title"></button>
      <button id="btn-reset" data-i18n="ui.reset" data-i18n-title="ui.reset.title"></button>
      <button id="btn-lang" data-i18n-title="ui.lang" class="icon"></button>
      <button id="btn-theme" data-i18n-title="ui.theme" class="icon"></button>
    </nav>
  </header>
  <main><div id="term"></div></main>
  <footer data-i18n="ui.hint"></footer>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <script type="module" src="js/main.js"></script>
</body>
</html>
